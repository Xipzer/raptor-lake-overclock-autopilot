[[quirk]]
id = "z790i-lightning-single-eps"
title = "Z790I Lightning: one 8-pin EPS for the whole CPU"
category = "board"
severity = "WARN"
confidence = "inference"
platform = { "board.model" = "Z790I Lightning" }
detect = [{ fact = "cpu.package_w_max", op = "ge", value = 300 }]
symptom = "None until a connector overheats."
cause = "About 400 W of package power is roughly 440 to 460 W of 12 V input through one 8-pin EPS. Commonly cited ratings for one EPS connector are about 300 to 380 W, depending on terminals and wire."
remediation = ["Use a good cable fully seated, touch-check the connector after a long run, and prefer settings that keep sustained package power lower."]
tuning = "Long all-core tests at 400 W are a hardware risk of their own on this board."
sources = ["https://www.tomshardware.com/pc-components/motherboards/asrock-z790i-lightning-wi-fi-review", "https://www.pcgamer.com/hardware/motherboards/asrock-z790i-lightning-wifi-motherboard-review/"]

[[quirk]]
id = "asrock-trfc-fallback-signature"
title = "ASRock training fallback signature: tRFC 395"
category = "recovery"
severity = "INFO"
confidence = "source"
platform = { "board.vendor" = ["asrock"], "mem.type" = ["DDR5"] }
symptom = "After a step the board boots slowly (135 to 282 s instead of about 45) and shows tRFC/tRFC2 395, tWR 54, tCL/tRCD/tRP 29."
cause = "Memory training failed and the board fell back to safe timings. A plain clamp (the BIOS raising one value) changes only that value and boots at normal speed."
remediation = ["The harness classifies this as NO TRAIN when values the step did not touch change; add fallback_signature = { tRFC = \"395\" } to [sweep]."]
tuning = "Treat NO TRAIN as the end of that group; the value did not train."
implications = [{ action = "note", text = "Set [sweep] fallback_signature = { tRFC = \"395\" } and watch tRFC, tCL, tRCD, tWR" }]
sources = ["own measurement: reference machine (raptor-lake-field-notes) tRFC 630 and tCL 36, 12-13 Nov (ram/quirks.md)"]
